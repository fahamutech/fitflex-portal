name: Deploy Portal to Firebase Hosting

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: portal-hosting-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-deploy:
    name: Build static export and deploy
    runs-on: ubuntu-latest

    # NEXT_PUBLIC_* values are baked into the static bundle at build time.
    # Every one has a production default; set a repository variable of the
    # same name only to override it (e.g. a new live API URL). The Firebase
    # web config is public by design and mirrors .env.example.
    env:
      NEXT_PUBLIC_API_BASE: ${{ vars.NEXT_PUBLIC_API_BASE || 'https://fitflex-faas.bfast.smartstock.co.tz' }}
      NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY || 'AIzaSyCleDGLHf71NdmbFkXbJVzS9tOsmIMj7tA' }}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN || 'fitflex-af-pilot.firebaseapp.com' }}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID || 'fitflex-af-pilot' }}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID || '1:318978253903:web:49b58d5fda05603645f63a' }}
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID || '318978253903-u6du2v8thfbdbmortdh49k1g06uv91v7.apps.googleusercontent.com' }}
      # Login photo panel (src/lib/flags.ts PHOTO_HERO_UI). Off unless the
      # repository variable is exactly 'true'. The photo manager flags
      # (NEXT_PUBLIC_HERO_IMAGES_ADMIN / _REMOTE) are deliberately not wired.
      NEXT_PUBLIC_PHOTO_HERO_UI: ${{ vars.NEXT_PUBLIC_PHOTO_HERO_UI || 'false' }}
      # Partner photos admin (src/lib/flags.ts). Off unless the repository variable is exactly 'true'.
      NEXT_PUBLIC_PARTNER_MEDIA_ADMIN: ${{ vars.NEXT_PUBLIC_PARTNER_MEDIA_ADMIN || 'false' }}
      # Member web portal /m (src/lib/flags.ts MEMBER_PORTAL). Off unless the repository variable is exactly 'true'.
      # Needs the server's IDENTITY_V2 + V2_PIN_LOGIN for sign-in, and Tunzaa or Lipa Namba to pay for a pass.
      NEXT_PUBLIC_MEMBER_PORTAL: ${{ vars.NEXT_PUBLIC_MEMBER_PORTAL || 'false' }}
      # Public gym page /g from a gym's printed QR (src/lib/flags.ts WEB_GYM_PROFILE). Off unless the repository
      # variable is exactly 'true'. Needs the server's WEB_GYM_PROFILE + QR_HMAC_SECRET.
      NEXT_PUBLIC_WEB_GYM_PROFILE: ${{ vars.NEXT_PUBLIC_WEB_GYM_PROFILE || 'false' }}
      # Browser check-in from that page (src/lib/flags.ts WEB_QR_CHECKIN): "Visit this gym", PIN sign-in, confirm.
      # Off unless the repository variable is exactly 'true'. Needs NEXT_PUBLIC_WEB_GYM_PROFILE and the server's
      # WEB_QR_CHECKIN + QR_HMAC_SECRET + IDENTITY_V2 + V2_PIN_LOGIN.
      NEXT_PUBLIC_WEB_QR_CHECKIN: ${{ vars.NEXT_PUBLIC_WEB_QR_CHECKIN || 'false' }}
      # Custom gym passes (src/lib/flags.ts GYM_CUSTOM_PASSES): owner /owner/memberships and pass analytics, the
      # /gym-pass invite page, the pass name on /scan, the gym's passes on /g and buying one on /m/gym-passes
      # (buying also needs NEXT_PUBLIC_MEMBER_PORTAL). Off unless the repository variable is exactly 'true'.
      # Needs the server's GYM_CUSTOM_PASSES.
      NEXT_PUBLIC_GYM_CUSTOM_PASSES: ${{ vars.NEXT_PUBLIC_GYM_CUSTOM_PASSES || 'false' }}
      # Marathon & events module (src/lib/flags.ts EVENTS_MODULE): the member Events page AND the staff organizer
      # (/organizer) and admin events areas. Off unless the repository variable is exactly 'true'. Needs the server's
      # EVENTS_MODULE (+ EVENTS_REGISTRATION and event payments for members to register).
      NEXT_PUBLIC_EVENTS_MODULE: ${{ vars.NEXT_PUBLIC_EVENTS_MODULE || 'false' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build static export
        run: npm run build

      - name: Deploy to Firebase Hosting (live)
        if: github.event_name != 'pull_request'
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FITFLEX_AF_PILOT }}
          projectId: fitflex-af-pilot
          channelId: live
