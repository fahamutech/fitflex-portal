name: Portal Checks

# Type-check, build and run the Playwright e2e suite on release-candidate, where
# agent work is merged and tested before promotion. This workflow never deploys:
# deploy-hosting.yml is the only one that deploys, and only for main.
#
# The e2e job checks out fitflex-functions (release-candidate) next to the portal
# and runs it on a throwaway Postgres service database; playwright.config.ts
# refuses any non-localhost API or a database not named fitflex_ci_*/fitflex_e2e_*.
on:
  push:
    branches: [release-candidate]
  pull_request:
    branches: [release-candidate]
  workflow_dispatch:

concurrency:
  group: portal-checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Type-check and build
    runs-on: ubuntu-latest

    # Same public defaults as deploy-hosting.yml; nothing here is deployed.
    env:
      NEXT_PUBLIC_API_BASE: ${{ vars.NEXT_PUBLIC_API_BASE || 'https://fitflex-faas.bfast.smartstock.co.tz' }}
      NEXT_PUBLIC_FIREBASE_API_KEY: ${{ vars.NEXT_PUBLIC_FIREBASE_API_KEY || 'AIzaSyCleDGLHf71NdmbFkXbJVzS9tOsmIMj7tA' }}
      NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN || 'fitflex-af-pilot.firebaseapp.com' }}
      NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_PROJECT_ID || 'fitflex-af-pilot' }}
      NEXT_PUBLIC_FIREBASE_APP_ID: ${{ vars.NEXT_PUBLIC_FIREBASE_APP_ID || '1:318978253903:web:49b58d5fda05603645f63a' }}
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${{ vars.NEXT_PUBLIC_GOOGLE_CLIENT_ID || '318978253903-u6du2v8thfbdbmortdh49k1g06uv91v7.apps.googleusercontent.com' }}
      # Login photo panel (src/lib/flags.ts PHOTO_HERO_UI). Off unless the
      # repository variable is exactly 'true'. The photo manager flags
      # (NEXT_PUBLIC_HERO_IMAGES_ADMIN / _REMOTE) are deliberately not wired.
      NEXT_PUBLIC_PHOTO_HERO_UI: ${{ vars.NEXT_PUBLIC_PHOTO_HERO_UI || 'false' }}
      # Partner photos admin (src/lib/flags.ts). Off unless the repository variable is exactly 'true'.
      NEXT_PUBLIC_PARTNER_MEDIA_ADMIN: ${{ vars.NEXT_PUBLIC_PARTNER_MEDIA_ADMIN || 'false' }}
      # Member web portal /m (src/lib/flags.ts MEMBER_PORTAL). Off unless the repository variable is exactly 'true'.
      # Needs the server's IDENTITY_V2 + V2_PIN_LOGIN for sign-in, and Tunzaa or Lipa Namba to pay for a pass.
      NEXT_PUBLIC_MEMBER_PORTAL: ${{ vars.NEXT_PUBLIC_MEMBER_PORTAL || 'false' }}
      # Marathon & events module (src/lib/flags.ts EVENTS_MODULE): the member Events page AND the staff organizer
      # (/organizer) and admin events areas. Off unless the repository variable is exactly 'true'. Needs the server's
      # EVENTS_MODULE (+ EVENTS_REGISTRATION and event payments for members to register).
      NEXT_PUBLIC_EVENTS_MODULE: ${{ vars.NEXT_PUBLIC_EVENTS_MODULE || 'false' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

  e2e:
    name: Playwright e2e (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fitflex
          POSTGRES_PASSWORD: fitflex
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      CI: 'true'
      # Same zone as the browser (playwright.config.ts): specs compute expected times in Node.
      TZ: Africa/Dar_es_Salaam
      FITFLEX_FUNCTIONS_DIR: ${{ github.workspace }}/fitflex-functions
      FITFLEX_E2E_DATABASE_URL: postgresql://fitflex:fitflex@localhost:5432/fitflex_e2e_portal
      JWT_SECRET: ci-only-secret-not-used-outside-github-actions

    steps:
      - name: Checkout portal
        uses: actions/checkout@v4
        with:
          path: portal

      - name: Checkout fitflex-functions (release-candidate)
        uses: actions/checkout@v4
        with:
          repository: fahamutech/fitflex-functions
          ref: release-candidate
          path: fitflex-functions

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            portal/package-lock.json
            fitflex-functions/package-lock.json

      - name: Install the bfast CLI (serves the functions)
        run: npm install -g bfast-tools@2.0.0

      # postinstall would migrate + seed DATABASE_URL; playwright.config.ts creates
      # and migrates the e2e database itself before starting the backend.
      - name: Install backend dependencies
        working-directory: fitflex-functions
        run: npm ci --ignore-scripts

      - name: Install portal dependencies
        working-directory: portal
        run: npm ci

      - name: Install Playwright browser
        working-directory: portal
        run: npx playwright install --with-deps chromium

      - name: Run e2e
        working-directory: portal
        run: npx playwright test --shard=${{ matrix.shard }}/3 --reporter=list

      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ matrix.shard }}
          path: portal/test-results
          retention-days: 7

  # A build flag is fixed when the portal starts, so these specs have their own configs.
  # Their API is mocked: no backend or database.
  e2e-flags:
    name: Playwright e2e (build flags)
    runs-on: ubuntu-latest
    timeout-minutes: 40

    env:
      CI: 'true'

    steps:
      - name: Checkout portal
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Use the public example env
        run: cp .env.example .env.local

      - name: Run e2e for each build flag
        run: |
          failed=0
          suite() {
            echo "::group::$*"
            env "$1" npx playwright test --config "playwright.$2.config.ts" --output "test-results/$1-$2" --reporter=list || failed=1
            echo "::endgroup::"
          }
          suite EVENTS_FLAG=true events
          suite EVENTS_FLAG=false events
          suite PARTNER_MEDIA_FLAG=true partner-media
          suite PARTNER_MEDIA_FLAG=false partner-media
          suite WEB_CHECKIN_FLAG=true web-checkin
          suite WEB_CHECKIN_FLAG=false web-checkin
          suite WEB_GYM_FLAG=true web-gym
          suite WEB_GYM_FLAG=false web-gym
          suite CI=true shop-merch
          suite CI=true admin-phase0
          exit $failed

      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-flags
          path: test-results
          retention-days: 7
